<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account — PanelZilla</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="nav"></nav>
  <div class="container">
    <div class="card auth-wrap">
      <div class="auth-tabs">
        <button id="tab-login" class="active">Log in</button>
        <button id="tab-register">Sign up</button>
      </div>
      <form id="auth-form">
        <div id="username-field" style="display:none;">
          <label>Username</label>
          <input id="username" autocomplete="username" placeholder="zilla_fan">
        </div>
        <label>Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
        <label>Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
        <div class="form-error" id="auth-error"></div>
        <button class="btn" style="width:100%; margin-top:18px;" id="submit-btn">Log in</button>
      </form>
    </div>
  </div>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
